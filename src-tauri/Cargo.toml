[package]
name = "browserpicker"
version = "0.1.1"
description = "Pick a browser for every link you open"
authors = ["asmn"]
license = "MIT"
repository = "https://github.com/asmnpl/BrowserPicker"
edition = "2021"
rust-version = "1.82"

[lib]
name = "browserpicker_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std", "NSString", "NSURL", "NSArray", "NSData", "NSBundle", "NSFileManager", "NSDictionary", "NSGeometry", "NSError",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std", "block2", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics",
  "NSWindow", "NSResponder", "NSEvent", "NSScreen",
] }

[target.'cfg(windows)'.dependencies]
png = "0.17"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
